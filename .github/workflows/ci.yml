name: macOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: brew install typst
      - run: swift test
      - run: python3 scripts/test-mcp.py "$(swift build --show-bin-path)/cv-vault-mcp"
      - run: ./build.sh --zip
